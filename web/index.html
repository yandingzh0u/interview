<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背题</title>
<link rel="stylesheet" href="/vendor/hljs-light.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="banner" id="banner" hidden></div>

<div class="offline" id="offline" hidden>
  <div class="offline-box">
    <p class="offline-title">连不上本地服务</p>
    <p class="offline-sub">题库没有丢。是服务没在跑，页面拿不到数据，才显示成空的。</p>
    <p class="offline-how">双击项目文件夹里的 <code>启动.bat</code>，等窗口出现地址后再点下面。</p>
    <button class="primary-btn" id="offlineRetry">重新连接</button>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-name">背题</span></div>
    <nav class="tabs">
      <button class="tab is-active" data-view="review">背诵</button>
      <button class="tab" data-view="bank">题库</button>
    </nav>
    <div class="topbar-right">
      <span class="pos" id="posInfo"></span>
      <span class="only" id="filterState" hidden></span>
      <span class="save-state" id="saveState"></span>
      <button class="text-btn" id="btnFilter">筛选</button>

      <div class="popover" id="filterPop" hidden>
        <div class="pop-group">
          <span class="pop-label">顺序</span>
          <div class="pop-chips" id="orderChips">
            <button class="chip is-active" data-order="seq">按录入</button>
            <button class="chip" data-order="random">随机</button>
          </div>
        </div>
        <div class="pop-group">
          <span class="pop-label">答题类型</span>
          <div class="pop-chips" id="catChips"></div>
        </div>
        <div class="pop-foot">
          <button class="text-btn" id="btnResetFilter">重置</button>
          <button class="primary-btn" id="btnApplyFilter">重新开始一轮</button>
        </div>
      </div>
    </div>
  </div>
</header>
<div class="progress-track"><i id="progressBar"></i></div>

<!-- ============ 背诵 ============ -->
<main class="view is-active" id="view-review">
  <div class="stage" id="stage">
    <div class="q-meta" id="qMeta"></div>
    <h1 class="q-text" id="qText"></h1>

    <div class="frame-block" id="frameBlock">
      <div class="skeleton" id="skeleton"></div>
    </div>

    <details class="note-block" id="noteBlock">
      <summary><span class="note-tag">备注</span><kbd class="note-kbd">N</kbd></summary>
      <div class="note-body markdown" id="noteBody"></div>
    </details>

    <div class="layers" id="layers"></div>

    <p class="hint" id="hint"></p>
  </div>

  <div class="empty" id="emptyState" hidden>
    <p class="empty-title">题库还是空的</p>
    <p class="empty-sub">去「题库」录第一道题，或者粘贴一段文本批量导入。</p>
    <button class="primary-btn" data-goto="bank">去录入</button>
  </div>

  <div class="summary" id="summary" hidden></div>
</main>

<!-- ============ 题库 ============ -->
<main class="view" id="view-bank">
  <div class="bank">
    <div class="bank-head">
      <input class="search" id="searchInput" placeholder="搜索题目或答案…" autocomplete="off">
      <button class="outline-btn" id="btnImport">批量导入</button>
      <button class="primary-btn" id="btnNew">新建题目</button>
    </div>
    <div class="cat-filter" id="catFilter"></div>
    <div class="bank-filters">
      <button class="chip is-active" data-bankfilter="active">全部</button>
      <button class="chip" data-bankfilter="empty">空白题</button>
      <button class="chip" data-bankfilter="deleted">回收站</button>
      <span class="bank-stat" id="bankStat"></span>
    </div>
    <div class="bank-list" id="bankList"></div>
  </div>
</main>

<!-- ============ 编辑抽屉 ============ -->
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span id="drawerTitle">新建题目</span>
    <button class="icon-btn" id="drawerClose" title="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <label class="field">
      <span class="field-label">题目</span>
      <textarea id="fQ" rows="3" placeholder="面试官怎么问，就怎么写。可以换行"></textarea>
    </label>

    <div class="field">
      <span class="field-label">答题类型 <em>决定固定分段</em></span>
      <div class="picker" id="catPicker"></div>
      <div class="skeleton-preview" id="skeletonPreview"></div>
    </div>

    <div class="field">
      <span class="field-label">按骨架分段 <em id="segHint">选完答题类型自动生成</em></span>
      <div class="seg-editor" id="segEditor"></div>
    </div>

    <div class="field">
      <span class="field-label">
        追问链
        <button type="button" class="mini-btn" id="btnAddFu">+ 加一条</button>
      </span>
      <div class="fu-editor" id="fuEditor"></div>
    </div>

    <div class="field">
      <span class="field-label">备注 <em>写给自己看的，不算答案</em></span>
      <textarea id="fNote" rows="3" placeholder="哪里没懂、自己的理解、面试时想补一句的话…不会混进上面的答案"></textarea>
    </div>

  </div>
  <div class="drawer-foot">
    <button class="text-btn danger" id="btnDelete" hidden>删除</button>
    <span class="spacer"></span>
    <button class="text-btn" id="drawerCancel">取消</button>
    <button class="primary-btn" id="drawerSave">保存<kbd>Ctrl↵</kbd></button>
  </div>
</aside>

<!-- ============ 批量导入 ============ -->
<div class="modal" id="importModal" hidden>
  <div class="modal-box">
    <h2 class="modal-title">批量导入</h2>
    <p class="modal-sub">
      每条题以 <code>Q:</code> 开头，字段各占一行。<code>Q:</code> 必填，<code>CAT:</code> 建议填；答案用 <code>SEG:</code> 一行写一段，以后补也行。<br>
      <code>CAT:</code> 填 7 套答题类型之一，比如 <code>方案与治理</code>；追问用 <code>FU:</code>，提示用 <code>|</code> 隔开；备注用 <code>NOTE:</code>，可以接着写多行。
    </p>
    <textarea id="importText" rows="13" spellcheck="false" placeholder="Q: 如何规避 RAG 系统中大模型的幻觉？
CAT: 方案与治理
SEG: RAG 里的幻觉主要有两类：一是检索没召回，二是召回了模型自行推断。
SEG: 一是在 Rerank 后卡阈值，二是 Prompt 硬约束，三是要求带引用编号，四是生成后核查。
FU: 怎么量化幻觉率？ | 用大模型把回答拆成陈述句，逐句对照原文核验（Faithfulness）"></textarea>
    <div class="modal-foot">
      <span class="import-count" id="importCount"></span>
      <span class="spacer"></span>
      <button class="text-btn" id="importCancel">取消</button>
      <button class="primary-btn" id="importConfirm">导入</button>
    </div>
  </div>
</div>

<div class="mask" id="mask"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
